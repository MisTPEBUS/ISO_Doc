server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Vite build 是以 base: "/ISO/" 產出的，根路徑導去該子路徑
    location = / {
        return 301 /ISO/;
    }

    # 檔名帶 hash 的靜態資源可長效快取
    location /ISO/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback；index.html 不快取，避免部署後前端吃到舊版本
    location /ISO/ {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /ISO/index.html;
    }

    # 文件/附件上傳可能超過 nginx 預設的 1m，backend 目前未設上限，這裡放寬
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 這裡寫死 https：此 nginx 只會由 Synology DSM 的 Reverse Proxy（已終止 TLS）呼叫，
        # 且 backend 服務不對外露 port，所以真實請求一定是走 HTTPS 進來的。
        # 若之後 frontend/backend 的 port 曝露方式改變，這裡務必一併重新檢視。
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
